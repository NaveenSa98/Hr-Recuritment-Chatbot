version: "3.1"

recipe: default.v1
language: en

pipeline:
  # Enhanced tokenization
- name: WhitespaceTokenizer
  intent_tokenization_flag: true
  intent_split_symbol: "_"

  # Improved feature extraction
- name: RegexFeaturizer
- name: LexicalSyntacticFeaturizer

  # Optimized text vectorization
- name: CountVectorsFeaturizer
  analyzer: "word"
  min_ngram: 1
  max_ngram: 2
  stop_words: "english"
  max_features: 5000
- name: CountVectorsFeaturizer
  analyzer: "char_wb"
  min_ngram: 3
  max_ngram: 4
  max_features: 2000

  # Core NLU model with enhanced settings
- name: DIETClassifier
  epochs: 150
  hidden_layers_sizes:
    text: [256, 128]
    label: [128, 64]
  embedding_dimension: 64
  constrain_similarities: true
  dropout: 0.25
  learning_rate: 0.001
  batch_size: 64
  batch_strategy: "balanced"
  evaluation_epochs: 5
  entity_recognition: true
  use_masked_language_model: true
  random_seed: 42

  # Response selection
- name: ResponseSelector
  epochs: 80
  hidden_layers_sizes:
    text: [256, 128]
  batch_size: 64
  constrain_similarities: true
  learning_rate: 0.0015
  dropout: 0.2

  # Robust fallback handling
- name: FallbackClassifier
  threshold: 0.35
  ambiguity_threshold: 0.15
  confidence_threshold: 0.7

policies:
  # Conversation management
- name: MemoizationPolicy
  max_history: 5
  priority: 1

- name: RulePolicy
  core_fallback_threshold: 0.35
  core_fallback_action_name: "action_default_fallback"
  enable_fallback_prediction: true
  restrict_rules: true
  priority: 2

  # Enhanced dialogue management
- name: TEDPolicy
  max_history: 7
  epochs: 100
  hidden_layers_sizes:
    text: [256, 192, 128]
    action: [128, 64]
  batch_size: 64
  learning_rate: 0.001
  dropout: 0.25
  constrain_similarities: true
  use_gpu: true
  priority: 3

  # Unexpected intent handling
- name: UnexpecTEDIntentPolicy
  max_history: 5
  epochs: 80
  constrain_similarities: true
  learning_rate: 0.0005
  priority: 4

assistant_id: recruitment-assistant-v2

# Training optimization
training_epochs: 100
random_seed: 42
evaluate_on_num_examples: 200
evaluate_every_num_epochs: 10
