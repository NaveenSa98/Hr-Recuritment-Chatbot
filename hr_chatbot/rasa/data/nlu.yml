version: "3.1"

nlu:
- intent: greet
  examples: |
    - Hi
    - Hello
    - Hey
    - Good morning
    - Good afternoon
    - Good evening
    - Hi there
    - Hello chatbot

- intent: goodbye
  examples: |
    - Bye
    - Goodbye
    - See you
    - See you later
    - Talk to you later
    - Have a good day
    - I'm done
    - That's all for now
    - Goodnight
    - Have a great night
    - Goodnight, chatbot
    - Thanks

- intent: ask_company_culture
  examples: |
    - What's the company culture like?
    - Tell me about your work environment
    - How would you describe the culture?
    - What's it like to work there?
    - Describe the company values
    - What are your core values?
    - What's the work culture at Faite?

- intent: ask_benefits
  examples: |
    - What benefits do you offer?
    - Tell me about your benefits package
    - What perks come with this job?
    - Do you provide health insurance?
    - What's included in your benefits?
    - What employee benefits are available?
    - What's your benefits policy?

- intent: ask_job_openings
  examples: |
    - What jobs are available?
    - Show me open positions
    - What are your current vacancies?
    - Do you have any job openings?
    - I'm looking for a job
    - What roles are you hiring for?
    - Show job vacancies
    - List available jobs

- intent: ask_job_requirements
  examples: |
    - What are the requirements for [DevOps Engineer](job_title) role?
    - What do I need to apply for [Software Engineer](job_title) job?
    - What qualifications are needed for [Software Engineer](job_title)?
    - What are the prerequisites for [DevOps Engineer](job_title)?
    - What skills are required for  [DevOps Engineer](job_title)?
    - What experience is needed for [Financial Analyst](job_title)?
    - What are the job criteria for [Financial Analyst](job_title)?
    - [Financial Analyst](job_title)
    - Requirements for [DevOps Engineer](job_title) role?
    - Search [DevOps Engineer](job_title) role?

- intent: ask_recruitment_process
  examples: |
    - How does your hiring process work?
    - What's the recruitment workflow?
    - Tell me about your hiring stages
    - What steps are in your hiring process?
    - How long does recruitment take?
    - What's your selection process?
    - Walk me through your hiring steps

- intent: ask_how_to_apply
  examples: |
    - How do I apply?
    - What's the application process?
    - How can I submit my application?
    - Where do I send my resume?
    - I want to apply for a job
    - How to submit application?
    - What are the application steps?
    - begin application

- intent: submit_application_form
  examples: |
    - Here's my application
    - I'm submitting my application
    - Application submitted
    - I've completed the form
    - Done with the application
    - Form filled out
    - Finished applying
    - /submit_application_form

- intent: ask_application_status
  examples: |
    - What's my application status?
    - Where is my application at?
    - Has my application been reviewed?
    - Check my application progress
    - What stage is my application in?
    - Status of my application
    - Update on my job application

- intent: provide_application_id
  examples: |
    - My ID is [12345](application_id)
    - Application ID: [FAITE-2023-456](application_id)
    - Here's my ID [7890](application_id)
    - [APP-2023-001](application_id)
    - The ID is [9876](application_id)
    - Reference number [6543](application_id)

- intent: start_application_form
  examples: |
    - I want to apply now
    - Start application
    - Begin the application form
    - Let me apply
    - Open application form
    - I'm ready to apply
    - Take me to the application

- intent: ask_interview_scheduling
  examples: |
    - I need to schedule an interview
    - Can we set up an interview?
    - Book an interview slot
    - Arrange an interview
    - When can I interview?
    - Pick interview time
    - Schedule my interview

- intent: select_interview_slot
  examples: |
    - I choose [Monday](date) at [2pm](time)
    - Slot: [2023-12-15](date) [10:00](time)
    - I'll take [Friday](date) [afternoon](time)
    - [Next week](date) [morning](time) works
    - [December 20](date) at [3:30](time)
    - [Virtual](inter_type) on [Tuesday](date) [11am](time)


- intent: technical_support
  examples: |
    - I'm having technical issues
    - The form isn't working
    - I need help with the application
    - Technical problem
    - Something's not working
    - Bug report
    - Website error


- intent: out_of_scope
  examples: |
    - What's the weather today?
    - Tell me a joke
    - How old are you?
    - Who made you?
    - What's your favorite color?
    - Can you sing?
    - What time is it?
    - Where do you live?