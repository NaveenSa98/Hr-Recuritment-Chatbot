version: "3.1"

nlu:
- intent: greet
  examples: |
    - Hi
    - Hello
    - Hey
    - Good morning
    - Good afternoon
    - Good evening
    - Hi there
    - Hello chatbot

- intent: goodbye
  examples: |
    - Bye
    - Goodbye
    - See you
    - See you later
    - Talk to you later
    - Have a good day
    - I'm done
    - That's all for now
    - Goodnight
    - Have a great night
    - Goodnight, chatbot
    - Thanks

- intent: ask_company_overview
  examples: |
    - Can you give me an overview of Faite?
    - Tell me about Faite as a company
    - What does Faite do?
    - I want to know about your company
    - What industry is Faite in?
    - What's Faite known for?
    - Give me a brief intro about the company
    - What is Faite's mission and vision?

- intent: ask_company_culture
  examples: |
    - What's the company culture like?
    - Tell me about your work environment
    - How would you describe the culture at Faite?
    - What's it like to work there?
    - How is the team dynamic at Faite?
    - What is your approach to employee collaboration?
    - Describe your office vibe
    - Is the work environment more relaxed or structured?

- intent: ask_company_values
  examples: |
    - What are your core values?
    - What does Faite stand for?
    - Tell me about the values your company follows
    - What principles guide your team?
    - What ethical standards does Faite follow?
    - Can you share Faite's guiding beliefs?

- intent: ask_company_benefits
  examples: |
    - What benefits do you offer employees?
    - Do you provide health insurance and PTO?
    - What's in your employee benefits package?
    - Are there any bonuses or perks?
    - What is the wellness support policy?
    - Do you offer relocation support?
    - What are the financial benefits at Faite?
    - Any learning and development opportunities?

- intent: ask_company_growth_opportunities
  examples: |
    - Are there growth opportunities at Faite?
    - How do you support career advancement?
    - Do you offer training or certifications?
    - Is there a clear career path in the company?
    - What does employee development look like?
    - How does Faite help employees grow professionally?
    - Can I switch roles internally in the future?

- intent: ask_job_openings
  examples: |
    - What jobs are available?
    - Show me open positions
    - What are your current vacancies?
    - Do you have any job openings?
    - I'm looking for a job
    - What roles are you hiring for?
    - Show job vacancies
    - List available jobs

- intent: ask_job_requirements
  examples: |
    - What are the requirements for [DevOps Engineer](job_title) role?
    - What do I need to apply for [Software Engineer](job_title) job?
    - What qualifications are needed for [Software Engineer](job_title)?
    - What are the prerequisites for [DevOps Engineer](job_title)?
    - What skills are required for  [DevOps Engineer](job_title)?
    - What experience is needed for [Financial Analyst](job_title)?
    - What are the job criteria for [Financial Analyst](job_title)?
    - [Financial Analyst](job_title)
    - Requirements for [DevOps Engineer](job_title) role?
    - Search [DevOps Engineer](job_title) role?

- intent: ask_recruitment_process
  examples: |
    - How does your hiring process work?
    - What's the recruitment workflow?
    - Tell me about your hiring stages
    - What steps are in your hiring process?
    - How long does recruitment take?
    - What's your selection process?
    - Walk me through your hiring steps

- intent: ask_how_to_apply
  examples: |
    - How do I apply?
    - What's the application process?
    - How can I submit my application?
    - Where do I send my resume?
    - I want to apply for a job
    - How to submit application?
    - What are the application steps?
    - begin application

- intent: ask_application_status
  examples: |
